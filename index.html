<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ຮ້ານແສງດາວ ປີ້ງຫູໝູ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--card:#161616;--gold:#f5c542;--white:#fff;--line:#2a2a2a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--white);font-family:'Noto Sans Lao','Phetsarath OT',system-ui,sans-serif;min-height:100vh}
header{text-align:center;padding:16px 12px 6px;padding-top:max(16px,env(safe-area-inset-top))}
header h1{color:var(--gold);font-size:clamp(20px,5vw,32px);font-weight:800;letter-spacing:.5px}
nav{position:sticky;top:0;z-index:5;background:rgba(10,10,10,.96);border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;padding:8px 4px}
nav button{min-width:0;background:var(--card);color:#ddd;border:1px solid var(--line);border-radius:10px;padding:7px 1px;font-family:inherit;font-weight:600;font-size:clamp(9px,2.35vw,15px);line-height:1.25;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center;word-break:keep-all}
nav button .pre{font-weight:400;opacity:.75;font-size:.85em}
@media(min-width:700px){nav button{flex-direction:row;gap:6px;font-size:16px;padding:10px 4px}}
nav button.on{background:var(--gold);color:#000;border-color:var(--gold)}
main{max-width:900px;margin:0 auto;padding:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s}
.card:active{transform:scale(.97)}
.card .ph{aspect-ratio:1/1;padding:10px 10px 0}
.card img,.big img{width:100%;height:100%;object-fit:cover;display:block;filter:drop-shadow(0 6px 12px rgba(0,0,0,.7))}
img.plate{border-radius:50%}
img.cut{object-fit:contain;border-radius:0}
.card .t{padding:8px 10px 10px}
.card .n{color:var(--gold);font-weight:600;font-size:15px;line-height:1.3}
.card .p{color:var(--white);font-size:14px;margin-top:2px}
.empty{grid-column:1/-1;text-align:center;color:#888;padding:50px 10px}
.noimg{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:48px;background:radial-gradient(#2b2b2b,#181818)}
/* Detail overlay */
#ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:16px}
#ov.show{display:flex;animation:f .2s}
@keyframes f{from{opacity:0}to{opacity:1}}
.box{width:100%;max-width:900px;cursor:default}
#back{background:rgba(255,255,255,.12);color:#fff;border:0;width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.row{display:flex;align-items:center;gap:20px}
.big{flex:0 0 55%;aspect-ratio:1/1}
.info{flex:1;min-width:0}
.info h2{color:var(--gold);font-size:clamp(22px,5.5vw,44px);font-weight:800;line-height:1.25;word-break:break-word}
.info .price{color:var(--white);font-size:clamp(18px,4.5vw,32px);margin-top:10px;font-weight:600}
</style>
</head>
<body>
<header><h1>ຮ້ານແສງດາວ ປີ້ງຫູໝູ</h1></header>
<nav id="tabs"></nav>
<main><div class="grid" id="grid"></div></main>

<div id="ov"><div class="box">
  <button id="back" aria-label="ກັບຄືນ">←</button>
  <div class="row"><div class="big" id="bigimg"></div>
  <div class="info"><h2 id="dn"></h2><div class="price" id="dp"></div></div></div>
</div></div>

<script>
/* ================== ຕັ້ງຄ່າ ================== */
// 7 ໝວດ: ຊື່ໂຟນເດີຮູບ = menu-images/<folder>/
const CATEGORIES = [
  {id:"grill",  name:"ປີ້ງ",     icon:"🔥"},
  {id:"fried",  name:"ທອດ",     icon:"🍤"},
  {id:"blanch", name:"ລວກ",     icon:"🥬"},
  {id:"soup",   name:"ຕົ້ມ/ແກງ", icon:"🍲"},
  {id:"stir",   name:"ຜັດ",     icon:"🍳"},
  {id:"salad",  name:"ຍຳ/ຕຳ",   icon:"🥗"},
  {id:"drinks", name:"ເຄື່ອງດື່ມ", icon:"🥤"}
];
// ຖ້າໃຊ້ໂດເມນຂອງຕົນເອງ ໃຫ້ໃສ່ owner/repo ບ່ອນນີ້ (ຖ້າເປັນ github.io ລະບົບຈະຮູ້ເອງ)
// ໂຟນເດີສຳລັບອັບໂຫຼດຮູບເມນູໂດຍສະເພາະ
const IMG_DIR = "menu-images";
const GITHUB = {owner:"", repo:"", branch:""};
/* ============================================ */

const $ = s => document.querySelector(s);
let DATA = {}, current = CATEGORIES[0].id;

// ອ່ານຊື່ໄຟລ໌ຮູບ -> {name, price, src}
// ລາຄາ = ຕົວເລກ (+ຫົວໜ່ວຍ) ທີ່ຢູ່ທ້າຍຊື່ໄຟລ໌, ສ່ວນທີ່ເຫຼືອທັງໝົດແມ່ນຊື່ເມນູ (ຊື່ເມນູມີ "-" ໄດ້)
// "ທອດປາໝຶກ-130,000 ກີບ.jpg"  -> ຊື່: ທອດປາໝຶກ      ລາຄາ: 130,000 ກີບ
// "ທອດກຸ້ງ-ປາໝຶກ 130,000ກີບ.jpg" -> ຊື່: ທອດກຸ້ງ-ປາໝຶກ  ລາຄາ: 130,000 ກີບ
const PRICE_RE = /(\d{1,3}(?:[,.]\d{3})+|\d{4,})\s*(ກີບ|kip|lak|₭|ບາດ|baht|thb)?\s*$/i;
function parseFile(file, folder){
  const base = decodeURIComponent(file).replace(/\.[^.]+$/, "").trim();
  const m = base.match(PRICE_RE);
  let name = base, price = "";
  if(m){
    name = base.slice(0, m.index).replace(/[\s\-–—_]+$/,"").trim() || base;
    price = m[1] + (m[2] ? " " + m[2] : "");
  }
  return {name, price, src:`${IMG_DIR}/${folder}/${encodeURIComponent(file)}`};
}
const isImg = f => /\.(jpe?g|jfif|png|webp|gif|avif)$/i.test(f);

function repoInfo(){
  if(GITHUB.owner && GITHUB.repo) return GITHUB;
  const h = location.hostname;
  if(!h.endsWith(".github.io")) return null;
  const owner = h.split(".")[0];
  const seg = location.pathname.split("/").filter(Boolean)[0];
  const repo = (seg && !seg.includes(".")) ? seg : `${owner}.github.io`;
  return {owner, repo, branch:""};
}

// ວິທີ 1: ອ່ານຊື່ໄຟລ໌ໃນໂຟນເດີອັດຕະໂນມັດຜ່ານ GitHub API
async function loadFromGitHub(){
  const r = repoInfo(); if(!r) return null;
  const cacheKey = "menu-cache-v2";
  try{ const c = JSON.parse(sessionStorage.getItem(cacheKey)||"null"); if(c) return c; }catch(e){}
  const out = {}; let total = 0;
  await Promise.all(CATEGORIES.map(async c=>{
    const url = `https://api.github.com/repos/${r.owner}/${r.repo}/contents/${IMG_DIR}/${c.id}` + (r.branch?`?ref=${r.branch}`:"");
    const res = await fetch(url);
    if(!res.ok) throw new Error("api "+res.status);
    const list = await res.json();
    out[c.id] = list.filter(x=>x.type==="file" && isImg(x.name)).map(x=>parseFile(x.name,c.id));
    total += out[c.id].length;
  }));
  if(!total) return null;
  try{ sessionStorage.setItem(cacheKey, JSON.stringify(out)); }catch(e){}
  return out;
}
// ວິທີ 2 (ສຳຮອງ): ອ່ານຈາກ menu.json
async function loadFromJson(){
  const res = await fetch("menu.json", {cache:"no-cache"});
  const j = await res.json(); const out = {};
  CATEGORIES.forEach(c => out[c.id] = (j[c.id]||[]).map(f=>parseFile(f,c.id)));
  return out;
}

function renderTabs(){
  $("#tabs").innerHTML = CATEGORIES.map((c,i)=>
    `<button data-id="${c.id}" class="${c.id===current?'on':''}"><span class="pre">ປະເພດ</span><span class="nm">${c.name}</span></button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    current=b.dataset.id; location.hash=current; renderTabs(); renderGrid(); scrollTo(0,0);
  });
}
function imgHTML(it, icon){
  const cls = /\.png$/i.test(it.src) ? "cut" : "plate"; // PNG = ຮູບຕັດພື້ນຫຼັງແລ້ວ, ຮູບອື່ນ = ຕັດເປັນວົງກົມສະເພາະຈານ
  return `<img class="${cls}" src="${it.src}" alt="" loading="lazy" onerror="this.outerHTML='<div class=noimg>${icon}</div>'">`;
}
function renderGrid(){
  const cat = CATEGORIES.find(c=>c.id===current);
  const items = DATA[current]||[];
  $("#grid").innerHTML = items.length ? items.map((it,i)=>
    `<div class="card" data-i="${i}"><div class="ph">${imgHTML(it,cat.icon)}</div>
     <div class="t"><div class="n">${esc(it.name)}</div><div class="p">${esc(it.price)}</div></div></div>`).join("")
    : `<div class="empty">ຍັງບໍ່ມີເມນູໃນໝວດນີ້</div>`;
  $("#grid").querySelectorAll(".card").forEach(el=>el.onclick=()=>openDetail(items[el.dataset.i], cat));
}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}

function openDetail(it, cat){
  $("#bigimg").innerHTML = imgHTML(it, cat.icon);
  $("#dn").textContent = it.name; $("#dp").textContent = it.price;
  $("#ov").classList.add("show"); document.body.style.overflow="hidden";
}
function closeDetail(){ $("#ov").classList.remove("show"); document.body.style.overflow=""; }
$("#back").onclick = e=>{e.stopPropagation();closeDetail()};
$("#ov").onclick = e=>{ if(!e.target.closest(".big,.info h2,.info .price,#back")) closeDetail(); };
addEventListener("keydown", e=>{ if(e.key==="Escape") closeDetail(); });

(async function init(){
  const h = location.hash.slice(1);
  if(CATEGORIES.some(c=>c.id===h)) current = h;
  try{ DATA = await loadFromGitHub(); }catch(e){ DATA = null; }
  if(!DATA){ try{ DATA = await loadFromJson(); }catch(e){ DATA = {}; } }
  renderTabs(); renderGrid();
})();
</script>
</body>
</html>
